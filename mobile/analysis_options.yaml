include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # `withOpacity` was deprecated in Flutter 3.27 in favour of `withValues`,
    # but withOpacity still works and the replacement is purely cosmetic.
    deprecated_member_use: ignore
    # Const-by-default is a micro-optimization; we apply it where it matters
    # but don't let the linter block builds on every literal.
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    use_build_context_synchronously: ignore

linter:
  rules:
    avoid_print: false
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacado
      POSTGRES_PASSWORD: vacado
      POSTGRES_DB: vacado
    ports:
      - "5432:5432"
    volumes:
      - vacado_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacado -d vacado"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgres://vacado:vacado@db:5432/vacado
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 30d
      OTP_TTL_SECONDS: 300
      OTP_DEV_BYPASS: "true"
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    command: ["sh", "-c", "node src/db/migrate.js && node src/db/seed.js && node src/server.js"]

volumes:
  vacado_pgdata:
